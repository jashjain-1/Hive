services:
  - type: web
    name: hivemind-mcp
    env: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: MODEL_CACHE_DIR
        value: /home/node/.cache/huggingface/hub
      - key: HIVE_TENANT_DIR
        value: /app/.hive/tenants
