<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hivemind graph</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #17181a;
    --bg-soft: #1e1f22;
    --line: #2b2d31;
    --text: #e6e6e6;
    --muted: #9aa0a6;
    --accent: #7aa2f7;
    --warn: #e0af68;
    --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    min-height: 46px; padding: 6px 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    background: var(--bg-soft);
  }
  @media (max-width: 760px) {
    #task, #apply { display: none; }
  }
  header h1 { font-size: 13px; font-weight: 600; letter-spacing: .2px; margin: 0; white-space: nowrap; }
  header .pill { color: var(--muted); font-size: 12px; white-space: nowrap; }
  header .spacer { flex: 1; }
  input[type="search"], input[type="text"] {
    background: #141517; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font: inherit; outline: none;
  }
  input:focus { border-color: #3d4f6d; }
  button {
    background: #26282c; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; font: inherit; cursor: pointer;
  }
  button:hover { background: #2f3237; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  #legend {
    position: absolute; left: 12px; bottom: 12px;
    background: rgba(23,24,26,.9); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; max-width: 240px; backdrop-filter: blur(4px);
  }
  #legend .lg-title { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .lg-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; cursor: pointer; }
  .lg-row:hover { color: #fff; }
  .lg-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .lg-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lg-count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  #hover {
    position: fixed; z-index: 20; pointer-events: none;
    background: rgba(24,25,28,.97); border: 1px solid #34373c; border-radius: 8px;
    padding: 8px 10px; min-width: 210px; max-width: 300px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    opacity: 0; transition: opacity .08s linear;
  }
  #hover.on { opacity: 1; }
  #hover .h-name { font-weight: 600; }
  #hover .h-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #hover .h-path { color: #8b93a1; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 3px; word-break: break-all; }

  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
    background: var(--bg-soft); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .16s ease;
    display: flex; flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  #panel header {
    height: auto; padding: 10px 12px; background: transparent;
    border-bottom: 1px solid var(--line); align-items: flex-start; flex-wrap: wrap;
  }
  #panel .p-name { font-size: 14px; font-weight: 600; }
  #panel .p-sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
  #panel .p-body { overflow-y: auto; padding: 12px; flex: 1; }
  .p-close { margin-left: auto; }
  .score-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .score-label { width: 62px; color: var(--muted); }
  .bar { flex: 1; height: 7px; background: #26282c; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .score-val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
  .reason { color: #a9b1bd; font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 8px; white-space: pre-wrap; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 6px; }
  .tabs button { padding: 3px 8px; font-size: 11px; }
  .tabs button.active { border-color: #3d6ea8; color: #cfe0ff; }
  pre.body {
    white-space: pre-wrap; word-break: break-word; margin: 0;
    background: #141517; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    max-height: 240px; overflow: auto;
  }
  .links { margin-top: 14px; }
  .links h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 0 0 6px; }
  .link-row { display: flex; gap: 6px; align-items: baseline; padding: 3px 0; border-bottom: 1px solid #232529; cursor: pointer; }
  .link-row:hover { color: #fff; }
  .link-rel { color: var(--muted); font-size: 11px; flex: none; width: 74px; }
  .link-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 24px 12px; }
  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Hivemind graph</h1>
  <span class="pill" id="counts">loading…</span>
  <div class="spacer"></div>
  <input id="search" type="search" placeholder="Search nodes…" aria-label="Search nodes" />
  <input id="task" type="text" placeholder="Task (optional score context)" aria-label="Task" />
  <button id="apply" type="button">Apply</button>
  <button id="reset" type="button">Reset view</button>
</header>

<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="status">loading graph…</div>
  <div id="legend" hidden>
    <div class="lg-title">Subsystems</div>
    <div id="legend-rows"></div>
  </div>
  <div id="hover"></div>
  <aside id="panel" aria-label="Node details">
    <header>
      <div>
        <div class="p-name" id="p-name"></div>
        <div class="p-sub" id="p-sub"></div>
      </div>
      <button class="p-close" id="p-close" type="button" aria-label="Close">×</button>
    </header>
    <div class="p-body">
      <div id="p-scores"></div>
      <div class="reason" id="p-reason"></div>
      <div class="tabs" id="p-tabs">
        <button data-level="0" type="button" class="active">L0</button>
        <button data-level="1" type="button">L1</button>
        <button data-level="2" type="button">L2</button>
      </div>
      <pre class="body" id="p-body">Select a level.</pre>
      <div class="links" id="p-out"></div>
      <div class="links" id="p-in"></div>
      <div class="actions">
        <button id="p-copy" type="button">Copy agent prompt</button>
        <button id="p-focus" type="button">Focus 1-hop</button>
      </div>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var tenant = params.get('tenantId') || params.get('tenant') || 'default';
  var task = params.get('task') || '';

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { alpha: false });
  var statusEl = document.getElementById('status');
  var countsEl = document.getElementById('counts');
  var hoverEl = document.getElementById('hover');
  var panel = document.getElementById('panel');
  var legend = document.getElementById('legend');
  var legendRows = document.getElementById('legend-rows');
  var searchEl = document.getElementById('search');
  var taskEl = document.getElementById('task');
  taskEl.value = task;

  var data = null;
  var nodes = [];
  var links = [];
  var byId = new Map();
  var index = new Map();
  var selected = null;
  var detail = null;
  var detailLevel = 0;
  var filterSubsystem = null;
  var hoverNode = null;

  var view = { k: 1, x: 0, y: 0 };
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var dragging = false;
  var dragMoved = 0;
  var last = { x: 0, y: 0 };

  function hashHue(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }
  function colorFor(subsystem) {
    return 'hsl(' + hashHue(subsystem) + ',58%,62%)';
  }

  function resize() {
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(r.width * dpr));
    canvas.height = Math.max(1, Math.floor(r.height * dpr));
    draw();
  }
  window.addEventListener('resize', resize);

  function fetchPayload() {
    var url = '/graph.json?tenantId=' + encodeURIComponent(tenant) +
      (taskEl.value.trim() ? '&task=' + encodeURIComponent(taskEl.value.trim()) : '');
    return fetch(url, { headers: { accept: 'application/json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('graph request failed: HTTP ' + r.status);
        return r.json();
      });
  }

  // ---- layout -------------------------------------------------------------
  // Simple force layout, run once, then frozen. Repulsion uses a spatial grid so
  // 5k nodes stay under a second on a laptop.
  function layout(list, edges) {
    var n = list.length;
    if (!n) return;
    var cell = 96;
    var grid = new Map();
    var i, j;

    function key(cx, cy) { return cx + ':' + cy; }
    function rebuild() {
      grid.clear();
      for (var a = 0; a < n; a++) {
        var nd = list[a];
        var cx = Math.floor(nd.x / cell), cy = Math.floor(nd.y / cell);
        var k = key(cx, cy);
        var bucket = grid.get(k);
        if (!bucket) { bucket = []; grid.set(k, bucket); }
        bucket.push(a);
      }
    }

    // seed on a spiral so the initial state has no coincident points
    for (i = 0; i < n; i++) {
      var ang = i * 2.399963;
      var rad = 18 * Math.sqrt(i + 1);
      list[i].x = Math.cos(ang) * rad;
      list[i].y = Math.sin(ang) * rad;
      list[i].vx = 0; list[i].vy = 0;
    }

    var iterations = n > 2500 ? 90 : n > 800 ? 140 : 220;
    for (var it = 0; it < iterations; it++) {
      rebuild();
      for (i = 0; i < n; i++) {
        var a1 = list[i];
        var cx = Math.floor(a1.x / cell), cy = Math.floor(a1.y / cell);
        for (var ox = -1; ox <= 1; ox++) {
          for (var oy = -1; oy <= 1; oy++) {
            var bucket = grid.get(key(cx + ox, cy + oy));
            if (!bucket) continue;
            for (var b = 0; b < bucket.length; b++) {
              j = bucket[b];
              if (j <= i) continue;
              var a2 = list[j];
              var dx = a2.x - a1.x, dy = a2.y - a1.y;
              var d2 = dx * dx + dy * dy;
              if (d2 > cell * cell * 4 || d2 < 0.01) continue;
              var dist = Math.sqrt(d2);
              var push = (cell * 0.85 - dist) / dist * 0.18;
              var fx = dx * push, fy = dy * push;
              a1.x -= fx; a1.y -= fy; a2.x += fx; a2.y += fy;
            }
          }
        }
      }
      for (var e = 0; e < edges.length; e++) {
        var s = list[edges[e].si], t = list[edges[e].ti];
        if (!s || !t) continue;
        var ex = t.x - s.x, ey = t.y - s.y;
        var ed = Math.sqrt(ex * ex + ey * ey) || 1;
        var target = 72;
        var f = (ed - target) / ed * 0.06;
        s.x += ex * f; s.y += ey * f;
        t.x -= ex * f; t.y -= ey * f;
      }
      // gentle pull to origin keeps disconnected islands on screen
      for (i = 0; i < n; i++) { list[i].x *= 0.9995; list[i].y *= 0.9995; }
    }
  }

  function fitView() {
    if (!nodes.length) return;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.x < minX) minX = n.x;
      if (n.y < minY) minY = n.y;
      if (n.x > maxX) maxX = n.x;
      if (n.y > maxY) maxY = n.y;
    }
    var w = canvas.clientWidth, h = canvas.clientHeight;
    var gw = Math.max(1, maxX - minX), gh = Math.max(1, maxY - minY);
    view.k = Math.max(0.08, Math.min(2.2, Math.min(w / gw, h / gh) * 0.86));
    view.x = w / 2 - ((minX + maxX) / 2) * view.k;
    view.y = h / 2 - ((minY + maxY) / 2) * view.k;
  }

  // ---- render -------------------------------------------------------------
  function draw() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#17181a';
    ctx.fillRect(0, 0, w, h);
    if (!nodes.length) return;

    ctx.translate(view.x, view.y);
    ctx.scale(view.k, view.k);

    var showAllEdges = links.length < 7000 || view.k > 0.55;
    ctx.lineWidth = 0.7 / view.k;
    for (var e = 0; e < links.length; e++) {
      var l = links[e];
      var s = byId.get(l.src), t = byId.get(l.dst);
      if (!s || !t) continue;
      var touches = selected && (l.src === selected.id || l.dst === selected.id);
      if (!showAllEdges && !touches) continue;
      var dim = selected && !touches;
      ctx.strokeStyle = touches
        ? 'rgba(122,162,247,.85)'
        : dim ? 'rgba(120,126,136,.05)' : 'rgba(120,126,136,' + (0.12 + 0.28 * Math.min(1, l.w)) + ')';
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(t.x, t.y);
      ctx.stroke();
    }

    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var isSel = selected && selected.id === n.id;
      var isHover = hoverNode && hoverNode.id === n.id;
      var isNeighbour = selected && (n._nb || false);
      var dimNode = (selected && !isSel && !isNeighbour) || (filterSubsystem && n.subsystem !== filterSubsystem);
      var r = n.r;

      ctx.globalAlpha = dimNode ? 0.22 : 1;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = n.color;
      ctx.fill();
      if (isSel || isHover) {
        ctx.lineWidth = 2 / view.k;
        ctx.strokeStyle = isSel ? '#cfe0ff' : '#ffffff';
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawLabels(w, h);
  }

  // Labels are placed in screen space so text stays 11px at every zoom level, with a
  // simple rectangle culling pass. Without it, dense graphs turn into a word cloud.
  function drawLabels(w, h) {
    var candidates = [];
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var isSel = selected && selected.id === n.id;
      var isHover = hoverNode && hoverNode.id === n.id;
      var important = isSel || isHover;
      if (!important && view.k < 1.9) continue;
      if (!important && n.score.composite < 0.5) continue;
      if (filterSubsystem && n.subsystem !== filterSubsystem && !important) continue;
      var sx = n.x * view.k + view.x;
      var sy = n.y * view.k + view.y;
      if (sx < -60 || sy < -20 || sx > w + 60 || sy > h + 20) continue;
      candidates.push({ n: n, sx: sx, sy: sy, p: important ? 2 + n.score.composite : n.score.composite });
    }
    candidates.sort(function (a, b) { return b.p - a.p; });

    ctx.font = '11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif';
    ctx.textBaseline = 'middle';
    var placed = [];
    var budget = 45;
    for (var c = 0; c < candidates.length && budget > 0; c++) {
      var cand = candidates[c];
      var label = cand.n.name;
      var width = ctx.measureText(label).width + 6;
      var x = cand.sx + cand.n.r * view.k + 4;
      var y = cand.sy;
      var clash = false;
      for (var p = 0; p < placed.length; p++) {
        var r = placed[p];
        if (x < r.x + r.w && x + width > r.x && y < r.y + 12 && y + 12 > r.y) { clash = true; break; }
      }
      if (clash) continue;
      placed.push({ x: x, y: y - 6, w: width });
      budget--;
      ctx.fillStyle = 'rgba(23,24,26,.75)';
      ctx.fillRect(x - 2, y - 7, width, 14);
      ctx.fillStyle = cand.n.id === (selected && selected.id) ? '#dbe6ff' : '#b9bfc7';
      ctx.fillText(label, x, y);
    }
    ctx.textBaseline = 'alphabetic';
  }

  function toWorld(mx, my) {
    return { x: (mx - view.x) / view.k, y: (my - view.y) / view.k };
  }

  function hitTest(mx, my) {
    var p = toWorld(mx, my);
    var best = null, bestD = Infinity;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var dx = p.x - n.x, dy = p.y - n.y;
      var d = dx * dx + dy * dy;
      var rr = (n.r + 6 / view.k);
      if (d < rr * rr && d < bestD) { best = n; bestD = d; }
    }
    return best;
  }

  // ---- data load ----------------------------------------------------------
  function applyPayload(payload) {
    data = payload;
    nodes = payload.nodes.map(function (n) {
      return {
        id: n.id, name: n.name, kind: n.kind, subsystem: n.subsystem,
        file: n.file, lines: n.lines, status: n.status, tokens: n.tokens,
        degree: n.degree, score: n.score,
        x: 0, y: 0, vx: 0, vy: 0,
        r: Math.min(6, 2.4 + 1.15 * Math.log(1 + n.degree.in + n.degree.out)),
        color: colorFor(n.subsystem)
      };
    });
    byId = new Map(nodes.map(function (n) { return [n.id, n]; }));
    index = new Map(nodes.map(function (n, i) { return [n.id, i]; }));
    links = payload.links.map(function (l) {
      return { src: l.src, dst: l.dst, rel: l.rel, w: l.w, si: index.get(l.src), ti: index.get(l.dst) };
    });

    layout(nodes, links);
    fitView();
    countsEl.textContent = payload.stats.nodes + ' nodes · ' + payload.stats.links + ' links · ' +
      payload.stats.subsystems + ' subsystems' + (payload.truncated ? ' · truncated' : '');
    statusEl.hidden = true;
    renderLegend();
    resize();
  }

  function renderLegend() {
    var counts = new Map();
    nodes.forEach(function (n) { counts.set(n.subsystem, (counts.get(n.subsystem) || 0) + 1); });
    var rows = Array.from(counts.entries()).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 10);
    legendRows.textContent = '';
    rows.forEach(function (entry) {
      var row = document.createElement('div');
      row.className = 'lg-row';
      var dot = document.createElement('span');
      dot.className = 'lg-dot';
      dot.style.background = colorFor(entry[0]);
      var name = document.createElement('span');
      name.className = 'lg-name';
      name.textContent = entry[0];
      var count = document.createElement('span');
      count.className = 'lg-count';
      count.textContent = String(entry[1]);
      row.appendChild(dot); row.appendChild(name); row.appendChild(count);
      row.addEventListener('click', function () {
        filterSubsystem = filterSubsystem === entry[0] ? null : entry[0];
        draw();
      });
      legendRows.appendChild(row);
    });
    legend.hidden = false;
  }

  function load() {
    statusEl.hidden = false;
    statusEl.textContent = 'loading graph…';
    fetchPayload().then(applyPayload).catch(function (err) {
      statusEl.hidden = false;
      statusEl.textContent = String(err.message || err);
    });
  }

  // ---- hover --------------------------------------------------------------
  canvas.addEventListener('mousemove', function (ev) {
    if (dragging) {
      var dx = ev.clientX - last.x, dy = ev.clientY - last.y;
      dragMoved += Math.abs(dx) + Math.abs(dy);
      view.x += dx; view.y += dy;
      last = { x: ev.clientX, y: ev.clientY };
      draw();
      return;
    }
    var n = hitTest(ev.offsetX, ev.offsetY);
    if (n !== hoverNode) {
      hoverNode = n;
      canvas.style.cursor = n ? 'pointer' : 'grab';
      draw();
    }
    if (!n) { hoverEl.classList.remove('on'); return; }
    hoverEl.textContent = '';
    var name = document.createElement('div');
    name.className = 'h-name';
    name.textContent = n.name;
    var sub = document.createElement('div');
    sub.className = 'h-sub';
    sub.textContent = n.kind + ' · ' + n.subsystem + ' · ' + n.degree.out + ' out / ' + n.degree.in + ' in';
    hoverEl.appendChild(name); hoverEl.appendChild(sub);
    if (n.file) {
      var path = document.createElement('div');
      path.className = 'h-path';
      path.textContent = n.file + (n.lines ? ':' + n.lines[0] + '–' + n.lines[1] : '');
      hoverEl.appendChild(path);
    }
    var bars = document.createElement('div');
    bars.style.marginTop = '6px';
    bars.id = 'hover-bars';
    hoverEl.appendChild(bars);
    paintBars(bars, n.score);
    hoverEl.classList.add('on');
    var pad = 14;
    var left = Math.min(ev.clientX + pad, window.innerWidth - hoverEl.offsetWidth - 8);
    var top = Math.min(ev.clientY + pad, window.innerHeight - hoverEl.offsetHeight - 8);
    hoverEl.style.left = Math.max(8, left) + 'px';
    hoverEl.style.top = Math.max(8, top) + 'px';
  });

  canvas.addEventListener('mouseleave', function () {
    hoverNode = null;
    hoverEl.classList.remove('on');
    draw();
  });

  // ---- pan / zoom ---------------------------------------------------------
  canvas.addEventListener('mousedown', function (ev) {
    dragging = true; dragMoved = 0;
    last = { x: ev.clientX, y: ev.clientY };
    canvas.classList.add('dragging');
  });
  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
  });
  canvas.addEventListener('click', function (ev) {
    if (dragMoved > 4) { dragMoved = 0; return; }
    var n = hitTest(ev.offsetX, ev.offsetY);
    if (n) select(n, true); else { clearSelection(); }
  });
  canvas.addEventListener('wheel', function (ev) {
    ev.preventDefault();
    var factor = Math.exp(-ev.deltaY * 0.0016);
    var mx = ev.offsetX, my = ev.offsetY;
    var before = toWorld(mx, my);
    view.k = Math.max(0.08, Math.min(6, view.k * factor));
    var after = toWorld(mx, my);
    view.x += (after.x - before.x) * view.k;
    view.y += (after.y - before.y) * view.k;
    draw();
  }, { passive: false });

  // ---- selection & panel --------------------------------------------------
  function scoreRows(score) {
    var rows = [
      ['Composite', score.composite, score.kind === 'pack' ? '#7aa2f7' : '#9aa0a6'],
      ['BM25', score.bm25 == null ? 0 : score.bm25, '#9ece6a'],
      ['Graph', score.graph, '#e0af68'],
      ['Vector', score.vector == null ? 0 : score.vector, '#bb9af7']
    ];
    return rows;
  }

  function paintBars(container, score) {
    container.textContent = '';
    scoreRows(score).forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'score-row';
      var label = document.createElement('span');
      label.className = 'score-label';
      label.textContent = r[0];
      var bar = document.createElement('span');
      bar.className = 'bar';
      var fill = document.createElement('i');
      fill.style.width = Math.round(Math.max(0, Math.min(1, r[1])) * 100) + '%';
      fill.style.background = r[2];
      bar.appendChild(fill);
      var val = document.createElement('span');
      val.className = 'score-val';
      val.textContent = (r[0] === 'Vector' && score.vector == null)
        ? 'off'
        : r[1].toFixed(2);
      row.appendChild(label); row.appendChild(bar); row.appendChild(val);
      container.appendChild(row);
    });
  }

  function select(node, fetchDetail) {
    selected = node;
    nodes.forEach(function (n) { n._nb = false; });
    links.forEach(function (l) {
      if (l.src === node.id) { var a = byId.get(l.dst); if (a) a._nb = true; }
      if (l.dst === node.id) { var b = byId.get(l.src); if (b) b._nb = true; }
    });
    draw();

    document.getElementById('p-name').textContent = node.name;
    document.getElementById('p-sub').textContent =
      node.kind + ' · ' + node.subsystem + ' · ' + node.status +
      (node.lines ? ' · L' + node.lines[0] + '–' + node.lines[1] : '');
    var scores = document.getElementById('p-scores');
    scores.textContent = '';
    paintBars(scores, node.score);
    document.getElementById('p-reason').textContent =
      node.file + '\n' + node.score.reason +
      '\nlevel hint: L' + node.score.level + ' · tokens ' + node.tokens.l0 + '/' + node.tokens.l1 + '/' + node.tokens.l2;
    panel.classList.add('open');

    if (fetchDetail) {
      document.getElementById('p-body').textContent = 'loading…';
      fetch('/graph/node?tenantId=' + encodeURIComponent(tenant) + '&id=' + encodeURIComponent(node.id))
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
          detail = d;
          renderDetailLinks(d);
          renderLevel(detailLevel);
        })
        .catch(function (err) {
          document.getElementById('p-body').textContent = String(err.message || err);
        });
    }
  }

  function renderDetailLinks(d) {
    renderLinkList('p-out', 'Outgoing (' + d.outgoing.length + ')', d.outgoing);
    renderLinkList('p-in', 'Incoming (' + d.incoming.length + ')', d.incoming);
  }

  function renderLinkList(containerId, title, list) {
    var box = document.getElementById(containerId);
    box.textContent = '';
    if (!list.length) return;
    var h = document.createElement('h3');
    h.textContent = title;
    box.appendChild(h);
    list.slice(0, 20).forEach(function (l) {
      var row = document.createElement('div');
      row.className = 'link-row';
      var rel = document.createElement('span');
      rel.className = 'link-rel';
      rel.textContent = l.rel;
      var name = document.createElement('span');
      name.className = 'link-name';
      name.textContent = l.name + '  ' + l.id;
      row.appendChild(rel); row.appendChild(name);
      row.addEventListener('click', function () {
        var target = byId.get(l.id);
        if (target) { select(target, true); centerOn(target); }
      });
      box.appendChild(row);
    });
  }

  function renderLevel(level) {
    detailLevel = level;
    Array.prototype.forEach.call(document.querySelectorAll('#p-tabs button'), function (b) {
      b.classList.toggle('active', Number(b.dataset.level) === level);
    });
    var el = document.getElementById('p-body');
    if (!detail) { el.textContent = 'no detail loaded'; return; }
    if (level === 0) el.textContent = detail.l0 || '(empty)';
    else if (level === 1) el.textContent = detail.l1 || '(no L1 stored)';
    else el.textContent = detail.l2 || '(no L2 stored — L3 is external)';
  }

  document.getElementById('p-tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (b) renderLevel(Number(b.dataset.level));
  });
  document.getElementById('p-close').addEventListener('click', clearSelection);
  document.getElementById('p-copy').addEventListener('click', function () {
    if (!selected) return;
    var text = 'Use hivemind to expand node ' + selected.id +
      ' ("' + selected.name + '") at level 2 and summarise its role, then call next to find related work.';
    navigator.clipboard.writeText(text).then(function () {
      var b = document.getElementById('p-copy');
      b.textContent = 'Copied';
      setTimeout(function () { b.textContent = 'Copy agent prompt'; }, 1200);
    });
  });
  document.getElementById('p-focus').addEventListener('click', function () {
    if (selected) { centerOn(selected); fitSelected(); }
  });

  function centerOn(n) {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    view.x = w / 2 - n.x * view.k;
    view.y = h / 2 - n.y * view.k;
    draw();
  }
  function fitSelected() {
    var hit = nodes.filter(function (n) { return n._nb || (selected && n.id === selected.id); });
    if (!hit.length) return;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    hit.forEach(function (n) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x); maxY = Math.max(maxY, n.y);
    });
    var w = canvas.clientWidth, h = canvas.clientHeight;
    view.k = Math.min(w / Math.max(1, maxX - minX), h / Math.max(1, maxY - minY)) * 0.6;
    view.x = w / 2 - ((minX + maxX) / 2) * view.k;
    view.y = h / 2 - ((minY + maxY) / 2) * view.k;
    draw();
  }

  function clearSelection() {
    selected = null; detail = null;
    nodes.forEach(function (n) { n._nb = false; });
    panel.classList.remove('open');
    draw();
  }

  // ---- toolbar ------------------------------------------------------------
  document.getElementById('apply').addEventListener('click', function () {
    var q = new URLSearchParams(location.search);
    q.set('tenantId', tenant);
    if (taskEl.value.trim()) q.set('task', taskEl.value.trim()); else q.delete('task');
    location.search = q.toString();
  });
  document.getElementById('reset').addEventListener('click', function () {
    filterSubsystem = null;
    fitView();
    draw();
  });
  searchEl.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    var q = searchEl.value.trim().toLowerCase();
    if (!q) return;
    var hit = nodes.find(function (n) {
      return n.name.toLowerCase().indexOf(q) !== -1 || n.id.toLowerCase().indexOf(q) !== -1;
    });
    if (hit) { select(hit, true); centerOn(hit); }
  });
  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') clearSelection();
  });

  resize();
  load();
})();
</script>
</body>
</html>
